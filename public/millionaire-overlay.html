<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>

 
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    background: url("Bureau_Man_sayarba7_1.jpg") center center / cover no-repeat;
   background-size: cover;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #content { display: none; width: 100%; height: 100vh; position: relative; }

  .ladder {
    position: absolute;
    top: 1%;
    right: 1%;
    width: 13%;
  /*  min-width: 120px; */
  }
  .ladder-row {
    height: 4vh;
    min-height: 26px;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1vw;
    font-size: clamp(11px, 1.2vw, 16px);
    color: #e8d28a;
    background: linear-gradient(180deg, #2a4d8f, #0d1b3a);
  }
  .ladder-row.current {
    background: #e8a23c;
    color: #1a1a1a;
    font-weight: 500;
    border: 1.5px solid #fff;
  }
  .ladder-row.top {
    background: #1f7a1f;
    color: #fff;
  }

  .lifelines {
    position: absolute;
    top: 1%;
    left: 1%;
    display: flex;
    flex-direction: column;
    gap: 1.5vh;
  }
  .lifeline {
    width: 5.5vw;
    height: 5.5vw;
    max-width: 70px;
    max-height: 70px;
    min-width: 44px;
    min-height: 44px;
    border-radius: 50%;
    background: #2a2a2a;
    border: 2px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    font-size: clamp(9px, 0.9vw, 12px);
    font-weight: 500;
  }
  .lifeline.used { opacity: 0.25; }

  .qbox {
    margin-bottom: 30px;
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    background: #1a5fb4;
    border: 1.5px solid #fff;
    border-radius: 6px;
    padding: 1.5% 2%;
    text-align: center;
    color: #fff;
    font-size: clamp(13px, 1.6vw, 20px);
    font-weight: 500;
  }

  .options {
    margin-bottom: 30px;
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1%;
  
  }
  .option {
    background: #1a3a6b;
    color: #e8d28a;
    border-radius: 6px;
    padding: 1.2% 1.5%;
    font-size: clamp(11px, 1.3vw, 16px);
    font-weight: 400;
    padding: 5px;
  }
  .option.eliminated { opacity: 0.15; }
  .option.correct { background: #1f7a1f; color: #fff; }
  .option.wrong { background: #a32d2d; color: #fff; }
</style>
</head>
<body>


<div id="content">
  <div class="lifelines">
    <div class="lifeline" id="ll-5050">50/50</div>
    <div class="lifeline" id="ll-audience">Public</div>
    <div class="lifeline" id="ll-phone">Ami</div>
  </div>

  <div class="ladder" id="ladder"></div>

  <div class="qbox" id="qbox"></div>
  <div class="options" id="options"></div>
</div>

<script>
  const STREAMER = new URLSearchParams(window.location.search).get('streamer')
  const SERVER = new URLSearchParams(window.location.search).get('server') || window.location.origin

  const AMOUNTS = ['1 000', '4 000', '8 000', '16 000', '32 000', '64 000', '125 000', '250 000', '500 000', '1 000 000']

  const content = document.getElementById('content')
  const ladderEl = document.getElementById('ladder')
  const qboxEl = document.getElementById('qbox')
  const optionsEl = document.getElementById('options')

  function renderLadder(playingLevel) {
    ladderEl.innerHTML = ''
    for (let i = 10; i >= 1; i--) {
      const row = document.createElement('div')
      row.className = 'ladder-row'
      if (i === 10) row.classList.add('top')
      if (i === playingLevel) row.classList.add('current')
      row.innerHTML = `<span>${i}</span><span>${AMOUNTS[i - 1]}</span>`
      ladderEl.appendChild(row)
    }
  }

  function renderQuestion(question, eliminated, lastChosen, lastStatus) {
    qboxEl.textContent = question.question_text
    optionsEl.innerHTML = ''
    const opts = [
      { key: 'A', text: question.option_a },
      { key: 'B', text: question.option_b },
      { key: 'C', text: question.option_c },
      { key: 'D', text: question.option_d },
    ]
    opts.forEach(o => {
      const div = document.createElement('div')
      div.className = 'option'
      if (eliminated && eliminated.includes(o.key)) {
        div.classList.add('eliminated')
      } else if (lastChosen && lastStatus) {
        if (o.key === question.correct_option) {
          div.classList.add('correct')
        } else if (o.key === lastChosen && lastStatus === 'wrong') {
          div.classList.add('wrong')
        }
      }
      div.textContent = `${o.key}: ${o.text}`
      optionsEl.appendChild(div)
    })
  }

  function renderLifelines(game) {
    document.getElementById('ll-5050').classList.toggle('used', game.used_5050)
    document.getElementById('ll-audience').classList.toggle('used', game.used_audience)
    document.getElementById('ll-phone').classList.toggle('used', game.used_phone)
  }

  async function fetchState() {
    try {
      const res = await fetch(`${SERVER}/api/millionaire/${STREAMER}/current`)
      const data = await res.json()
      if (data.game && data.question) {
        content.style.display = 'block'
        renderLadder(data.game.playing_level)
        renderQuestion(data.question, data.game.eliminated_options, data.game.last_chosen_option, data.game.last_answer_status)
        renderLifelines(data.game)
      } else {
        content.style.display = 'none'
      }
    } catch {}
  }

  fetchState()
  setInterval(fetchState, 3000)
</script>
</body>
</html>
