 
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    height: 100vh;
    padding: 1.5rem;
    overflow: hidden;
  }

  #popup {
    background: rgba(15,15,16,0.92);
    border: 2px solid #6c63ff;
    border-radius: 14px;
    padding: 14px 18px;
    min-width: 260px;
    max-width: 400px;
    display: none;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; transform: translateY(10px); }
  }
  #popup.hiding { animation: fadeOut 0.4s ease forwards; }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .mic-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #6c63ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .mic-icon.playing { animation: pulse 0.8s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(108,99,255,0.6); }
    50% { box-shadow: 0 0 0 10px rgba(108,99,255,0); }
  }
  .username { font-size: 1rem; font-weight: 700; color: #e8e8e4; }
  .label { font-size: 0.75rem; color: #888; }

  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 24px;
  }
  .bar {
    width: 3px;
    background: #6c63ff;
    border-radius: 2px;
    min-height: 4px;
    animation: wave 0.8s ease-in-out infinite;
  }
  .bar:nth-child(2) { animation-delay: 0.1s; }
  .bar:nth-child(3) { animation-delay: 0.2s; }
  .bar:nth-child(4) { animation-delay: 0.15s; }
  .bar:nth-child(5) { animation-delay: 0.05s; }
  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 18px; }
  }
  .waveform.idle .bar { animation: none; height: 4px; }
</style>
</head>
<body>

<div id="popup">
  <div class="header">
    <div class="mic-icon" id="mic-icon">🎙️</div>
    <div>
      <div class="username" id="username">—</div>
      <div class="label">Message vocal</div>
    </div>
  </div>
  <div class="waveform idle" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
  </div>
</div>

<audio id="player"></audio>

<script>
  const STREAMER = new URLSearchParams(window.location.search).get('streamer')
  const SERVER   = new URLSearchParams(window.location.search).get('server') || window.location.origin

  const popup    = document.getElementById('popup')
  const usernameEl = document.getElementById('username')
  const player   = document.getElementById('player')
  const waveform = document.getElementById('waveform')
  const micIcon  = document.getElementById('mic-icon')

  let playing = false
  let queue = []

  async function fetchQueue() {
    try {
      const res = await fetch(`${SERVER}/api/queue?username=${STREAMER}`)
      const data = await res.json()
      queue = data.queue || []
      if (!playing) playNext()
    } catch {}
  }

  async function playNext() {
    if (playing || queue.length === 0) return
    const msg = queue[0]
    playing = true

    usernameEl.textContent = msg.chatter_username
    popup.style.display = 'block'
    popup.classList.remove('hiding')
    waveform.classList.remove('idle')
    micIcon.classList.add('playing')

    player.src = msg.file_url.startsWith('http') ? msg.file_url : `${SERVER}${msg.file_url}`
    player.play().catch((err) => {
  console.error('Play failed:', err)
  markPlayed(msg.id)
})
    player.onended = () => markPlayed(msg.id)
  }

  async function markPlayed(id) {
    waveform.classList.add('idle')
    micIcon.classList.remove('playing')
    popup.classList.add('hiding')
    await new Promise(r => setTimeout(r, 400))
    popup.style.display = 'none'
    playing = false

    await fetch(`${SERVER}/api/voice/played`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    }).catch(() => {})

    setTimeout(playNext, 1000)
  }

  // Poll kol 3 secondes
  fetchQueue()
  setInterval(fetchQueue, 3000)
</script>
</body>
</html>
